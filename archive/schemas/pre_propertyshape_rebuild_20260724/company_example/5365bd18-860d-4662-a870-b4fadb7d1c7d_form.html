<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CompanySchema — Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@ulb-darmstadt/shacl-form/dist/bundle.js" type="module"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-submit { background: #007bff; color: white; }
    .btn-reset  { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>CompanySchema</h1>
  <p>A company with address and products, each managed by a person</p>
  <shacl-form id="shacl-form" data-collapse="open"></shacl-form>
  <div class="actions">
    <button class="btn-submit" onclick="submitForm()">Review &amp; Submit</button>
    <button class="btn-reset" onclick="document.getElementById('shacl-form').reset()">Reset</button>
  </div>
  <pre id="output" style="display:none; background:#f4f4f4; padding:16px; border-radius:4px; font-size:12px; margin-top:20px; white-space:pre-wrap;"></pre>
  <script type="module">
    const form = document.getElementById('shacl-form');
    form.setAttribute('data-shapes', `@prefix sh: <http://www.w3.org/ns/shacl#> .
@prefix dash: <http://datashapes.org/dash#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix schema: <http://example.org/schema/5365bd18-860d-4662-a870-b4fadb7d1c7d/> .
@prefix org: <http://example.org/org/#> .
@prefix foaf: <http://example.org/foaf/#> .
@prefix ex: <http://example.org/ex/#> .

# Root Shape
schema:CompanyShape a sh:NodeShape ;
    sh:targetClass org:Organization ;
    rdfs:label "CompanyShape" ;
    rdfs:comment "A company with address and products" ;
    sh:property [
        sh:path org:name ;
        sh:name "Company Name"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:homepage ;
        sh:name "Website"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:hasAddress ;
        sh:node schema:AddressShape ;
        sh:name "AddressShape"@en ;
        sh:order 0 ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        dash:editor dash:DetailsEditor ;
        dash:viewer dash:DetailsViewer ;
    ] ;
    sh:property [
        sh:path org:hasProduct ;
        sh:node schema:ProductShape ;
        sh:name "ProductShape"@en ;
        sh:order 0 ;
        sh:minCount 0 ;
        dash:editor dash:DetailsEditor ;
        dash:viewer dash:DetailsViewer ;
    ] .

# Component: product1-shape (depth 0)
schema:Product1Shape a sh:NodeShape ;
    sh:targetClass org:Product ;
    rdfs:label "Product1Shape" ;
    rdfs:comment "First product line" ;
    sh:property [
        sh:path org:productName ;
        sh:name "Product 1 Name"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        sh:group schema:mine ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:description ;
        sh:name "Description"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:order 1 ;
        sh:group schema:mine ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:productCode ;
        sh:name "SKU Code"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 2 ;
        sh:group schema:mine ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:order 0 .

# Component: product2-shape (depth 0)
schema:Product2Shape a sh:NodeShape ;
    sh:targetClass org:Product ;
    rdfs:label "Product2Shape" ;
    rdfs:comment "Second product line" ;
    sh:property [
        sh:path org:productName ;
        sh:name "Product 2 Name"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        sh:group schema:mine ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:description ;
        sh:name "Description"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:order 1 ;
        sh:group schema:mine ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:productCode ;
        sh:name "SKU Code"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 2 ;
        sh:group schema:mine ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:order 1 .

# Component: b57488a9-8a56-496a-b390-1aa8140814f8 (depth 0)
schema:EU_Address a sh:NodeShape ;
    sh:targetClass ex:EUAddress ;
    rdfs:label "EU Address" ;
    rdfs:comment "European address format with country selection" ;
    sh:property [
        sh:path schema:streetAddress ;
        sh:name "Street"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path schema:addressLocality ;
        sh:name "City/Town"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path ex:postalCode ;
        sh:name "Postal Code"@en ;
        sh:description "Format varies by country"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:order 2 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path schema:addressCountry ;
        sh:name "Country"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:in ("ex:DE" "ex:FR" "ex:IT" "ex:ES" "ex:NL" "ex:BE" "ex:AT" "ex:PL") ;
        sh:order 3 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] .

# Component: 3509c09e-1274-40a7-a96a-daf58a361d77 (depth 0)
schema:AddressShape a sh:NodeShape ;
    sh:targetClass org:Address ;
    rdfs:label "AddressShape" ;
    rdfs:comment "Postal address" ;
    sh:property [
        sh:path org:street ;
        sh:name "Street"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:houseNumber ;
        sh:name "Number"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:zipCode ;
        sh:name "ZIP Code"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 2 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:town ;
        sh:name "Town"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 3 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path org:country ;
        sh:name "Country"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 4 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] .

# Component: eb49bf40-422e-4c9e-9b28-0e2bc44f8eb4 (depth 0)
schema:PersonShape a sh:NodeShape ;
    sh:targetClass foaf:Person ;
    rdfs:label "PersonShape" ;
    rdfs:comment "A person (product manager etc.)" ;
    sh:property [
        sh:path foaf:name ;
        sh:name "Name"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path foaf:mbox ;
        sh:name "Email"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] .

# Property Groups
schema:mine a sh:PropertyGroup ;
    rdfs:label "PRODUCTS" ;
    sh:order 0 .

# Group assignments on root shape
schema:CompanyShape sh:property [
    sh:path schema:hasProduct1Shape ;
    sh:node schema:Product1Shape ;
    sh:name "Product1Shape"@en ;
    sh:group schema:mine ;
    sh:order 0 ;
] .

schema:CompanyShape sh:property [
    sh:path schema:hasProduct2Shape ;
    sh:node schema:Product2Shape ;
    sh:name "Product2Shape"@en ;
    sh:group schema:mine ;
    sh:order 1 ;
] .

# Schema Metadata
# Schema ID: 5365bd18-860d-4662-a870-b4fadb7d1c7d
# Schema Name: CompanySchema
# Description: A company with address and products, each managed by a person
# Created: 2026-05-07T10:24:49.295157
# Updated: 2026-05-29T10:19:10.062199
# Root Brick: 2680574d-7b7f-49d9-8475-18da71075052
# Component Bricks: 6
# Components: 2680574d-7b7f-49d9-8475-18da71075052, 3509c09e-1274-40a7-a96a-daf58a361d77, eb49bf40-422e-4c9e-9b28-0e2bc44f8eb4, product1-shape, product2-shape, b57488a9-8a56-496a-b390-1aa8140814f8
`);
    window.submitForm = async () => {
      const valid = await form.validate(false);
      if (!valid) return;
      const out = document.getElementById('output');
      out.textContent = form.serialize();
      out.style.display = 'block';
      out.scrollIntoView({behavior: 'smooth'});
    };
  </script>
</body>
</html>
