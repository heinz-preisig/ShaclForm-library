<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BatteryPassport — Form</title>
  <script type="module" src="https://unpkg.com/@ulb-darmstadt/shacl-form@3.1.0/dist/bundle.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-submit { background: #007bff; color: white; }
    .btn-reset  { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>BatteryPassport</h1>
  <p>Sample EU Battery Regulation digital product passport schema.</p>
  <shacl-form id="shacl-form" data-collapse="open"></shacl-form>
  <div class="actions">
    <button class="btn-submit" onclick="submitForm()">Review &amp; Submit</button>
    <button class="btn-reset" onclick="document.getElementById('shacl-form').reset()">Reset</button>
  </div>
  <pre id="output" style="display:none; background:#f4f4f4; padding:16px; border-radius:4px; font-size:12px; margin-top:20px; white-space:pre-wrap;"></pre>
  <script type="module">
    const form = document.getElementById('shacl-form');
    form.setAttribute('data-shapes', `@prefix app: <http://example.org/app#> .
@prefix dash: <http://datashapes.org/dash#> .
@prefix dcterms: <http://purl.org/dc/terms/> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix schema: <http://example.org/schema/d0a63dea-bfa8-447c-b073-f2564fdda8e0/> .
@prefix sh: <http://www.w3.org/ns/shacl#> .
@prefix unit: <http://qudt.org/vocab/unit/> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

# Root Shape
schema:Battery a sh:NodeShape ;
    sh:targetClass <https://example.org/battery#Battery> ;
    rdfs:label "Battery" ;
    rdfs:comment "Root shape for an EV battery digital product passport." ;
    dcterms:source <http://example.org/brick/8e43db7b-54a5-4da3-93c8-e9195d6d89d7/1.0.0/> ;
    sh:property [
        sh:path <https://example.org/battery#identifier> ;
        sh:name "Serial number"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#nominalVoltage> ;
        sh:name "Nominal voltage"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        app:physicalProperty <https://w3id.org/promo/property/macroscopic/V_113> ;
        app:defaultUnit unit:V ;
        sh:order 2 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#ratedCapacity> ;
        sh:name "Rated capacity"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        app:defaultUnit unit:A_HR ;
        sh:order 3 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#mass> ;
        sh:name "Mass"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        app:defaultUnit unit:KiloGM ;
        sh:order 4 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#maxTemperature> ;
        sh:name "Maximum operating temperature"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        app:defaultUnit unit:DEG_C ;
        sh:order 5 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#minTemperature> ;
        sh:name "Minimum operating temperature"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        app:defaultUnit unit:DEG_C ;
        sh:order 6 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#manufactureDate> ;
        sh:name "Manufacture date"@en ;
        sh:datatype xsd:date ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 7 ;
        dash:editor dash:DatePickerEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#responsiblePerson> ;
        sh:name "Responsible person"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 8 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#stateOfHealth> ;
        sh:name "State of health"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        app:defaultUnit unit:PERCENT ;
        sh:order 9 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://example.org/battery#cycleCount> ;
        sh:name "Cycle count"@en ;
        sh:datatype xsd:integer ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 10 ;
        dash:editor dash:IntegerFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] .

# Schema Metadata
# Schema ID: d0a63dea-bfa8-447c-b073-f2564fdda8e0
# Schema Name: BatteryPassport
# Description: Sample EU Battery Regulation digital product passport schema.
# Created: 2026-07-24T15:59:13.889620
# Updated: 2026-07-24T15:59:13.889680
# Root Brick: 8e43db7b-54a5-4da3-93c8-e9195d6d89d7
# Component Bricks: 10
# Components: 06d1f287-794c-4106-b2ab-789016b154dd, fb1a8b0e-0f0d-4601-a62b-43b2ea29ebeb, e98eb908-7f31-4888-884a-0d78b6b2413e, 2e20ea19-4883-4eb4-ba94-9e13bae2d8f6, ef2755f6-ba7d-46eb-9519-0d92585ec495, 59ee8d1d-f95c-45a4-9d42-6774a986d349, f4ce6f5d-31d6-47c8-9952-326be043b94f, d7a4be40-4d51-4992-8401-c31194fac944, 17bfafa7-6e0f-4ca3-bcf6-8d7d0a4665f4, 1cc59f81-da86-464c-9431-050e90ef1bf7
`);
    window.submitForm = async () => {
      const valid = await form.validate(false);
      if (!valid) return;
      const out = document.getElementById('output');
      out.textContent = form.serialize();
      out.style.display = 'block';
      out.scrollIntoView({behavior: 'smooth'});
    };
  </script>
</body>
</html>
