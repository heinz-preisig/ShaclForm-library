<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glass — Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@ulb-darmstadt/shacl-form/dist/bundle.js" type="module"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-submit { background: #007bff; color: white; }
    .btn-reset  { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>Glass</h1>
  
  <shacl-form id="shacl-form" data-collapse="open"></shacl-form>
  <div class="actions">
    <button class="btn-submit" onclick="submitForm()">Review &amp; Submit</button>
    <button class="btn-reset" onclick="document.getElementById('shacl-form').reset()">Reset</button>
  </div>
  <pre id="output" style="display:none; background:#f4f4f4; padding:16px; border-radius:4px; font-size:12px; margin-top:20px; white-space:pre-wrap;"></pre>
  <script type="module">
    const form = document.getElementById('shacl-form');
    form.setAttribute('data-shapes', `@prefix dash: <http://datashapes.org/dash#> .
@prefix ex: <http://example.org/ex/#> .
@prefix qudt: <http://qudt.org/schema/qudt/> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix schema: <http://example.org/schema/e4b0f0f2-c45f-4dd0-a62a-bb824c781529/> .
@prefix sh: <http://www.w3.org/ns/shacl#> .
@prefix unit: <http://qudt.org/vocab/unit/> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

# Component: 15e8a2c5-5db7-4b3e-8dd9-d4ed479b1ccd (depth 0)
schema:Mass a sh:NodeShape ;
    rdfs:label "Mass" ;
    sh:property [
        sh:path qudt:value ;
        sh:name "value"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:class qudt:Mass ;
        sh:in (unit:AMU unit:CARAT unit:CWT_LONG unit:CWT_SHORT unit:CentiGM unit:DRAM_UK unit:DRAM_US unit:DWT unit:DecaGM unit:DeciGM unit:DeciTONNE unit:DeciTON_Metric unit:EarthMass unit:FemtoGM unit:GM unit:GM_Carbon unit:GM_DRY unit:GM_Nitrogen unit:GRAIN unit:HectoGM unit:Hundredweight_UK unit:Hundredweight_US unit:KiloGM unit:KiloLB unit:KiloTONNE unit:KiloTON_Metric unit:LB unit:LB_M unit:LB_T unit:LunarMass unit:MOMME_Pearl unit:MOMME_Textile unit:MegaGM unit:MegaTON unit:MegaTONNE unit:MicroGM unit:MilliGM unit:NanoGM unit:OZ unit:OZ_M unit:OZ_TROY unit:PENNYWEIGHT unit:PFUND unit:PicoGM unit:PlanckMass unit:Quarter_UK unit:SLUG unit:SolarMass unit:Stone_UK unit:TON unit:TONNE unit:TON_Assay unit:TON_LONG unit:TON_Metric unit:TON_SHORT unit:TON_UK unit:TON_US unit:U) ;
        sh:defaultValue unit:KiloGM ;
        sh:order 0 ;
        dash:editor dash:InstancesSelectEditor ;
        dash:viewer dash:LabelViewer ;
    ] .

# Schema References (sh:node)
# Reference: FullAddress attached to 6233d5e0-2ffb-4d7d-b68e-25475e727335 via ex:fulladdress
schema:6233d5e0-2ffb-4d7d-b68e-25475e727335 sh:property [
    sh:path ex:fulladdress ;
    sh:node schema:FullAddress ;
] .
# schema:FullAddress is defined in schema: a5194c8b-2938-4b89-9bef-d52cee37d299

# Schema Metadata
# Schema ID: e4b0f0f2-c45f-4dd0-a62a-bb824c781529
# Schema Name: Glass
# Description: 
# Created: 2026-05-06T17:05:10.283327
# Updated: 2026-06-16T15:48:59.005207
# Root Brick: 
# Component Bricks: 1
# Components: 15e8a2c5-5db7-4b3e-8dd9-d4ed479b1ccd
`);
    window.submitForm = async () => {
      const valid = await form.validate(false);
      if (!valid) return;
      const out = document.getElementById('output');
      out.textContent = form.serialize();
      out.style.display = 'block';
      out.scrollIntoView({behavior: 'smooth'});
    };
  </script>
</body>
</html>
