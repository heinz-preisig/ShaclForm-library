<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glass — Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@ulb-darmstadt/shacl-form/dist/bundle.js" type="module"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-submit { background: #007bff; color: white; }
    .btn-reset  { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>Glass</h1>
  
  <shacl-form id="shacl-form" data-collapse="open"></shacl-form>
  <div class="actions">
    <button class="btn-submit" onclick="submitForm()">Review &amp; Submit</button>
    <button class="btn-reset" onclick="document.getElementById('shacl-form').reset()">Reset</button>
  </div>
  <pre id="output" style="display:none; background:#f4f4f4; padding:16px; border-radius:4px; font-size:12px; margin-top:20px; white-space:pre-wrap;"></pre>
  <script type="module">
    const form = document.getElementById('shacl-form');
    form.setAttribute('data-shapes', `@prefix sh: <http://www.w3.org/ns/shacl#> .
@prefix dash: <http://datashapes.org/dash#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix qudt: <http://qudt.org/schema/qudt/> .
@prefix quantitykind: <http://qudt.org/vocab/quantitykind/> .
@prefix unit: <http://qudt.org/vocab/unit/> .
@prefix schema: <http://example.org/schema/e4b0f0f2-c45f-4dd0-a62a-bb824c781529/> .
@prefix http: <http://example.org/http/#> .

# Component: 6aa89485-c782-4332-890c-9c89ffe3e119 (depth 0)
schema:gugus a sh:NodeShape ;
    rdfs:label "gugus" ;
    sh:property [
        sh:path <http://xmlns.com/foaf/0.1/accountName> ;
        sh:name "account"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <http://example.org/shapes#mass> ;
        sh:name "mass"@en ;
        sh:datatype xsd:decimal ;
        sh:minCount 0 ;
        sh:order 1 ;
        dash:editor dash:DecimalFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] .

# Schema References (sh:node)
# Reference: FullAddress attached to 6233d5e0-2ffb-4d7d-b68e-25475e727335 via ex:fulladdress
schema:6233d5e0-2ffb-4d7d-b68e-25475e727335 sh:property [
    sh:path ex:fulladdress ;
    sh:node schema:FullAddress ;
] .
# schema:FullAddress is defined in schema: a5194c8b-2938-4b89-9bef-d52cee37d299

# Schema Metadata
# Schema ID: e4b0f0f2-c45f-4dd0-a62a-bb824c781529
# Schema Name: Glass
# Description: 
# Created: 2026-05-06T17:05:10.283327
# Updated: 2026-06-15T17:22:56.662335
# Root Brick: 
# Component Bricks: 1
# Components: 6aa89485-c782-4332-890c-9c89ffe3e119
`);
    window.submitForm = async () => {
      const valid = await form.validate(false);
      if (!valid) return;
      const out = document.getElementById('output');
      out.textContent = form.serialize();
      out.style.display = 'block';
      out.scrollIntoView({behavior: 'smooth'});
    };
  </script>
</body>
</html>
