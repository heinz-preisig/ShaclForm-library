<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toy Digital Product Passport — Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@ulb-darmstadt/shacl-form/dist/bundle.js" type="module"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-submit { background: #007bff; color: white; }
    .btn-reset  { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>Toy Digital Product Passport</h1>
  <p>EU Toy Safety Regulation – Annex VI DPP schema (bricks: toy_dpp library)</p>
  <shacl-form id="shacl-form" data-collapse="open"></shacl-form>
  <div class="actions">
    <button class="btn-submit" onclick="submitForm()">Review &amp; Submit</button>
    <button class="btn-reset" onclick="document.getElementById('shacl-form').reset()">Reset</button>
  </div>
  <pre id="output" style="display:none; background:#f4f4f4; padding:16px; border-radius:4px; font-size:12px; margin-top:20px; white-space:pre-wrap;"></pre>
  <script type="module">
    const form = document.getElementById('shacl-form');
    form.setAttribute('data-shapes', `@prefix sh: <http://www.w3.org/ns/shacl#> .
@prefix dash: <http://datashapes.org/dash#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix schema: <http://example.org/schema/toy-dpp-schema-001/> .
@prefix https: <http://example.org/https/#> .

# Root Shape
schema:ToyDigitalProductPassport a sh:NodeShape ;
    sh:targetClass <https://schema.org/Product> ;
    rdfs:label "ToyDigitalProductPassport" ;
    rdfs:comment "Digital Product Passport for toys as required by Article 20 and Annex VI of the EU Toy Safety Regulation. Contains all 14 mandatory fields from Annex VI Part I." ;
    sh:property [
        sh:path <https://schema.org/productID> ;
        sh:name "Unique Product Identifier"@en ;
        sh:description "Unique product identifier linked to the data carrier on the toy. Annex VI Part I (a)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/name> ;
        sh:name "Toy Model Name"@en ;
        sh:description "Commercial name identifying the specific toy model. Annex VI Part I (e)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/description> ;
        sh:name "Toy Model Description"@en ;
        sh:description "Description enabling traceability of the toy model. Annex VI Part I (e)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 2 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/image> ;
        sh:name "Product Image URL"@en ;
        sh:description "Colour image of sufficient clarity to identify the toy. Annex VI Part I (e)."@en ;
        sh:datatype xsd:anyURI ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 3 ;
        dash:editor dash:URIEditor ;
        dash:viewer dash:URIViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/identifier> ;
        sh:name "Commodity Code"@en ;
        sh:description "Commodity code under Regulation (EEC) No 2658/87. Annex VI Part I (f). Optional if not applicable."@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 4 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/description> ;
        sh:name "Manufacturer Responsibility Statement"@en ;
        sh:description "Statement that the DPP is issued under the sole responsibility of the manufacturer. Annex VI Part I (d)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 5 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/legislationIdentifier> ;
        sh:name "Union Law Reference"@en ;
        sh:description "Reference to Union law the toy complies with. Annex VI Part I (g). Repeat for each regulation/directive."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:order 6 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/identifier> ;
        sh:name "Harmonised Standard Reference"@en ;
        sh:description "Reference to harmonised standards or common specifications used. Annex VI Part I (i)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:order 7 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/description> ;
        sh:name "Declaration of Conformity Replacement"@en ;
        sh:description "Mention that this DPP replaces an EU Declaration of Conformity. Annex VI Part I (h). Omit if not applicable."@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 8 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/additionalProperty> ;
        sh:name "CE Marking Present"@en ;
        sh:description "Confirmation that CE marking is affixed to the toy. Annex VI Part I (k)."@en ;
        sh:datatype xsd:boolean ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 9 ;
        dash:editor dash:BooleanSelectEditor ;
        dash:viewer dash:BooleanViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/additionalProperty> ;
        sh:name "Allergenic Fragrance"@en ;
        sh:description "Allergenic fragrance subject to labelling (Annex II Appendix Part B.1). Annex VI Part I (l). Omit if none present above threshold."@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:order 10 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/url> ;
        sh:name "Distributor Communication Channel"@en ;
        sh:description "Channel for distributors to obtain the data carrier copy. Article 7(12) / Annex VI Part I (m)."@en ;
        sh:datatype xsd:anyURI ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 11 ;
        dash:editor dash:URIEditor ;
        dash:viewer dash:URIViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/url> ;
        sh:name "DPP Service Provider Reference"@en ;
        sh:description "Reference to the DPP service provider hosting the back-up copy. Annex VI Part I (n)."@en ;
        sh:datatype xsd:anyURI ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 12 ;
        dash:editor dash:URIEditor ;
        dash:viewer dash:URIViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/url> ;
        sh:name "Safety Gate Portal Link"@en ;
        sh:description "Link to Safety Gate Portal for reporting unsafe toys. Article 20(11)."@en ;
        sh:datatype xsd:anyURI ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 13 ;
        dash:editor dash:URIEditor ;
        dash:viewer dash:URIViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/description> ;
        sh:name "Safety Information and Warnings"@en ;
        sh:description "Safety information and warnings. Annex VI Part II (a). Optional."@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 14 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/description> ;
        sh:name "Instructions of Use"@en ;
        sh:description "Instructions of use. Annex VI Part II (b). Optional."@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 15 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path schema:manufacturer ;
        sh:node schema:EconomicOperator ;
        sh:name "EconomicOperator"@en ;
        sh:order 0 ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        dash:editor dash:DetailsEditor ;
        dash:viewer dash:DetailsViewer ;
    ] ;
    sh:property [
        sh:path schema:manufacturer ;
        sh:node schema:EconomicOperator ;
        sh:name "EconomicOperator"@en ;
        sh:order 0 ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        dash:editor dash:DetailsEditor ;
        dash:viewer dash:DetailsViewer ;
    ] ;
    sh:property [
        sh:path schema:certification ;
        sh:node schema:NotifiedBody ;
        sh:name "NotifiedBody"@en ;
        sh:order 0 ;
        sh:minCount 0 ;
        dash:editor dash:DetailsEditor ;
        dash:viewer dash:DetailsViewer ;
    ] .

# Component: a1b2c3d4-0001-4000-8000-000000000001 (depth 0)
schema:EconomicOperator a sh:NodeShape ;
    sh:targetClass <https://schema.org/Organization> ;
    rdfs:label "EconomicOperator" ;
    rdfs:comment "Reusable brick for any economic operator (manufacturer, authorised representative, responsible operator). Annex VI Part I (b)(c)." ;
    sh:property [
        sh:path <https://schema.org/legalName> ;
        sh:name "Legal Name"@en ;
        sh:description "Full legal name of the operator"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/streetAddress> ;
        sh:name "Street Address"@en ;
        sh:description "Street address including number"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/addressLocality> ;
        sh:name "City / Locality"@en ;
        sh:description "City or locality"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 2 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/postalCode> ;
        sh:name "Postal Code"@en ;
        sh:description "Postal / ZIP code"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 3 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/addressCountry> ;
        sh:name "Country"@en ;
        sh:description "ISO 3166-1 alpha-2 country code"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 4 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/identifier> ;
        sh:name "Unique Operator Identifier"@en ;
        sh:description "Unique operator identifier. Annex VI Part I (b)(c)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 5 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/email> ;
        sh:name "Email"@en ;
        sh:description "Contact email address"@en ;
        sh:datatype xsd:string ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 6 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/url> ;
        sh:name "Website URL"@en ;
        sh:description "Website URL of the operator"@en ;
        sh:datatype xsd:anyURI ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 7 ;
        dash:editor dash:URIEditor ;
        dash:viewer dash:URIViewer ;
    ] .

# Component: a1b2c3d4-0002-4000-8000-000000000002 (depth 0)
schema:NotifiedBody a sh:NodeShape ;
    sh:targetClass <https://schema.org/Organization> ;
    rdfs:label "NotifiedBody" ;
    rdfs:comment "Notified body that intervened in the conformity assessment procedure. Annex VI Part I (j)." ;
    sh:property [
        sh:path <https://schema.org/name> ;
        sh:name "Name"@en ;
        sh:description "Name of the notified body"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 0 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/identifier> ;
        sh:name "Notified Body Number"@en ;
        sh:description "Official notified body number assigned by the Commission"@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 1 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/identifier> ;
        sh:name "Certificate Reference"@en ;
        sh:description "Reference number of the conformity assessment certificate. Annex VI Part I (j)."@en ;
        sh:datatype xsd:string ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:order 2 ;
        dash:editor dash:TextFieldEditor ;
        dash:viewer dash:LabelViewer ;
    ] ;
    sh:property [
        sh:path <https://schema.org/url> ;
        sh:name "Certificate URL"@en ;
        sh:description "URL to the certificate document"@en ;
        sh:datatype xsd:anyURI ;
        sh:minCount 0 ;
        sh:maxCount 1 ;
        sh:order 3 ;
        dash:editor dash:URIEditor ;
        dash:viewer dash:URIViewer ;
    ] .

# Schema Metadata
# Schema ID: toy-dpp-schema-001
# Schema Name: Toy Digital Product Passport
# Description: EU Toy Safety Regulation – Annex VI DPP schema (bricks: toy_dpp library)
# Created: 2026-05-07T19:18:11.087010
# Updated: 2026-05-07T19:19:55.710756
# Root Brick: a1b2c3d4-0003-4000-8000-000000000003
# Component Bricks: 5
# Components: a1b2c3d4-0003-4000-8000-000000000003, a1b2c3d4-0001-4000-8000-000000000001, a1b2c3d4-0001-4000-8000-000000000001, a1b2c3d4-0002-4000-8000-000000000002, a1b2c3d4-0002-4000-8000-000000000002

# Additional Metadata:
# regulation: EU Toy Safety Regulation
# brick_library: toy_dpp
# annex: VI
`);
    window.submitForm = async () => {
      const valid = await form.validate(false);
      if (!valid) return;
      const out = document.getElementById('output');
      out.textContent = form.serialize();
      out.style.display = 'block';
      out.scrollIntoView({behavior: 'smooth'});
    };
  </script>
</body>
</html>
